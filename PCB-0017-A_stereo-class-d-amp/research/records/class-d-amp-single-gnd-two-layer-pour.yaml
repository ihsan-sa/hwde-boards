envelope_note: 'Bounded to 2 layers: with only two copper layers the bottom pour must be both return and
  heat spreader, which is what forbids slots and AGND islands. On 4+ layers an inner GND plane carries
  the return and the outer-layer rules relax to the star-point part only.'

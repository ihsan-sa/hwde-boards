rule: null
prose: 'The TPA31xxD2 has no analog ground pin: p4 lists GND at pins 9, 22, 25, 28 and the PowerPAD (pin
  33) to GND; AVCC (17) is the analog supply. On 2 layers the return is ONE net: pad + GND pins are the
  star point (p28 10.1), top filled with GND around the IC, bottom a solid GND plane ''for low impedance
  return path'', joined by many vias under the pad and along the edge (p29 Fig 40, p30 Fig 41). TI''s
  EVM (SLOU342A p8 Fig 5, p9 Fig 6): bottom is a GND pour carrying the wide PVCC feed, eight short jumpers
  on the input side and two on the output side (R+, L- runs); p7 Fig 4 keeps small-signal parts on the
  pin-1 side away from the filters. Rule: no AGND/PGND split; small-signal parts on the input side, filters
  on the other; bottom jumpers only short, never through the via grid or between pad and filter caps.
  Why: the pad is both thermal path and current return; a slot in the pour lengthens both.'

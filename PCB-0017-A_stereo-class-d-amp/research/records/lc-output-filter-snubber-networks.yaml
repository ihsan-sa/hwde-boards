envelope_note: >
  Scales with the switching frequency and edge of this family: the values
  (18R/330pF, 3.3R/10nF + 1nF, bead < 10 MHz) are TI's numbers for the
  TPA31xxD2 stages over their programmable 376-1278 kHz range; the two-
  network pattern generalizes, the values do not.

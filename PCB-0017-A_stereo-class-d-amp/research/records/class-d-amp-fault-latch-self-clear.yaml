id: class-d-amp-fault-latch-self-clear
classes:
- sequencing
applies:
  topologies:
  - class-d-amp
  packages: []
  interfaces: []
  parts:
  - TPA3116D2
  - TPA3118D2
  - TPA3130D2
rule:
  enforced_by: null
  thermal_trip_c: 150
  sdz_low_clear_s: 1.4
  self_clear: FAULTZ tied to SDZ, one pull-up
prose: 'Thermal and short-circuit faults on the TPA31xxD2 latch. p18 (7.3.11): the die trips at 150 C
  +/-15 C, enters shutdown with outputs disabled, and stays there (''this is a latched fault''); the fault
  is reported on FAULTZ as a low. To recover without a microcontroller, ''connect the FAULTZ pin directly
  to the SDZ pin'' - FAULTZ pulls SDZ low, which clears the latch, and the part restarts when the die
  cools. p18 Fig 31 gives the alternative for a uP: SDZ must be held low for more than 1.4 s to clear
  the latch. p4: FAULTZ is open drain (needs a pull-up), SDZ high = outputs enabled. p17 (7.3.8 Table
  4): over-current (output short to PVCC or GND), over-temperature and DC offset are LATCHED with FAULTZ
  low; PVCC under/over-voltage are self-clearing. p17 (7.3.10): the short-circuit latch is cleared by
  cycling SDZ low, and the same FAULTZ-to-SDZ tie gives automatic recovery. p26 Fig 37 shows the tie:
  R13 100k pull-up on SDZ with FAULTZ wired to the same node. Design consequence for a copper-only 2-layer
  board: sustained overload past the thermal budget is survivable - the part cycles on thermal shutdown
  - but audible; the self-clearing tie is the right default when no host exists, and the latched form
  (FAULTZ to a host, SDZ from the host) when one does. The 10 ms input-cap charging window (p16 7.3.7,
  RC <= 1 ms) applies at every restart, so a self-clearing design must also keep the input RC small or
  it pops on each recovery.'

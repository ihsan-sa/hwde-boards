envelope_note: 'Scales with how faults are meant to clear: the FAULTZ-to-SDZ tie is the self-clearing
  form, the host-driven SDZ pulse (>1.4 s) the latched form; both are this family''s mechanism, not a
  general class-D sequencing rule, hence family level.'

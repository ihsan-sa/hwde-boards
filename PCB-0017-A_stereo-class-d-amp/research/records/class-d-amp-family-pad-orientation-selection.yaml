id: class-d-amp-family-pad-orientation-selection
classes:
- selection
- thermal
applies:
  topologies:
  - class-d-amp
  packages:
  - HTSSOP-32-DAP
  - HTSSOP-32-DAD
  interfaces: []
  parts:
  - TPA3116D2
  - TPA3118D2
  - TPA3130D2
rule: null
prose: 'Selecting inside a class-D family: the PowerPAD orientation decides the cooling path before the
  wattage does. SLOS708 p1: three parts share one footprint - TPA3130D2 (2 x 15 W/8 ohm at 15 V), TPA3118D2
  (2 x 30 W/8 ohm at 24 V) and TPA3116D2 (2 x 50 W/4 ohm at 21 V); DAD = 32-pin HTSSOP PowerPAD UP, DAP
  = PowerPAD DOWN. p3: the TPA3116D2 exists ONLY in DAD (pad up, ''TPA3116D2 only''); TPA3118D2/TPA3130D2
  are DAP (pad down). A pad-up part sheds heat only through a clip-on sink (p6 footnote 4: its 14 C/W
  is with a 14x25x50 mm sink; p1: ''small heat-sink attached to its top side PowerPAD''), so a design
  that cools through the PCB must pick the pad-down sibling even if that lowers the headline power - at
  a rail well below the sibling''s maximum the output is rail-limited anyway (p27: PVCC design range 4.5-26
  V, output power set by PVCC and load). p6 gives the numbers to compare: DAP 22 C/W (3118) and 36 C/W
  (3130) no sink, vs DAD 14 C/W with sink. Rule: (1) state the cooling path (copper vs clip sink) first;
  (2) take the highest-power pad-down part whose min load matches the speaker (p4 pin table is shared,
  so the schematic does not change); (3) only go pad-up when a sink is mechanically in the product.'

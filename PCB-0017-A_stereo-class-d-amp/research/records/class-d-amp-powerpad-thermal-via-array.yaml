- file: research/sources/slma002h.pdf
  page: 9
  note: 'Fig 10 example land sizes and via patterns; text: 0.33 mm or smaller drill, solder-mask CAP on
    component side >= via dia + 0.1 mm, far-side tenting increases voiding'
- file: research/sources/slma002h.pdf
  page: 7
  note: 'Fig 7 TQFP thermal land: copper skirt larger than the mask-defined pad with an outer ring of
    0.33 mm vias'
- file: research/sources/slma002h.pdf

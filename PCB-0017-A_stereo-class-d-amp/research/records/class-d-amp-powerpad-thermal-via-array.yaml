  board_layers:
    min: 2
    max: 4
envelope_note: 'Scales with pad orientation and layer count: a pad-UP (DAD) part has no pad on the board,
  so the array does nothing for it; SLMA002''s via curves are given for 2- and 4-layer boards, past that
  inner planes take over and the count/pitch here is no longer the limiting number.'
verification: {by: "research-second-reader", date: "2026-09-27", note: "Pass 2: SLMA002 p9 text 'solder mask ... cap the vias on the component side with a dimension equal to the via diameter + 0.1 mm minimum' now read as a cap, matches; p7 Fig 7 added and shows 8.0 copper skirt, 5.19 SMD pad, 25x 0.33 vias with outer ring. Rest unchanged and correct."}

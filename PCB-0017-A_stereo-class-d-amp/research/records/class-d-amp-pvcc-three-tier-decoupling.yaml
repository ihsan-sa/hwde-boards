envelope_note: 'Scales with the PVCC rail: the cap values and 50 V rating are stated for the family''s
  4.5-26 V range; above that the ratings and the bulk sizing change, below it nothing here is limiting.
  Cap placement (one group per bridge, into the pad) does not scale.'

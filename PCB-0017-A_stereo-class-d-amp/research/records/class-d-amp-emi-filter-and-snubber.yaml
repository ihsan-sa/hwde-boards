envelope_note: 'Scales with switching frequency: the 330 pF/10 ohm and 3.3 ohm/10 nF values are tuned
  for this family''s 400 kHz-1.2 MHz PWM range (p27 design requirements); a different fsw changes the
  snubber corner and the filter cutoff, though the placement rule survives.'

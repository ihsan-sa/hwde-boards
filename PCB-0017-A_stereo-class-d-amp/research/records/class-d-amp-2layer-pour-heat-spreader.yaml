envelope:
  pdiss_w:
    max: 3.8
envelope_note: 'Scales with dissipated power: at the EVM''s 22 C/W the 85 C rise from Ta 40 C to Tj 125
  C is used up at 3.8 W, and above that the 2-layer pour cannot hold Tj without a sink or PLIMIT. Below
  it the rule (pour + stitch, RthJA from the EVM) is the design; the actual RthJA of a smaller board is
  still the designer''s to verify.'
verification: {by: "second-reader", date: "2026-09-27", note: "Content byte-identical to the pass-1 verified text (git diff 74354438..9c44b583 shows only status/maturity/verification reset); citations unchanged. Re-read SLOS708 p6 Table 6.4 (DAP 22/36 C/W, psiJB 4.7, psiJT 0.3, fn4 DAD with 14x50x25 mm sink), p29 Fig 40, p30 Fig 41 annotations; SLOU342A p7 2-layer pour. Nit stands: fn3 names the EVM layout, not that 22 C/W was measured on it."}

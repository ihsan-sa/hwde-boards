rule: null
prose: 'Principle for any switching audio output stage: the loop from each output pin through its filter
  (ferrite or LC) and the small filter cap back to GND is the board''s antenna, so its area sets the EMI;
  make it as small and tight as possible, and bring every ground - PVCC decoupling, filter caps, snubbers
  - to the IC''s GND/thermal pad as a central (star) ground. SLOS708 p28 (10.1): ''keep the current loop
  from each of the outputs through the ferrite bead and the small filter cap and back to GND as small
  and tight as possible. The size of this current loop determines its effectiveness as an antenna''; ''all
  ground should be connected at the IC GND, which should be used as a central ground connection or star
  ground''; the filter should be placed as close to the output terminals/outputs as possible. p29 Fig
  40 annotations: ''output filters placed close to the output pins to minimize return loop'', ''direct
  low impedance traces for PVCC and output traces''. SLOU342A p7 Fig 4: L1-L4 sit one part-length from
  OUTxx pins on wide traces, the filter caps between the inductors and the terminals with their GND ends
  on the top pour; p9 Fig 6 x-ray: the bottom-side routes are the wide PVCC feed from the binding post
  to the two PVCC pin groups plus about nine short small-signal jumpers left of U1 - nothing bottom-side
  under the output loops on the right. The mechanism is loop area x di/dt, which bounds nothing about
  the operating point, so this is a principle; the class-D wording keys retrieval.'

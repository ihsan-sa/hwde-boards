envelope:
  rload_ohm: {min: 4, max: 8}
maturity: verified
generalizes: []
envelope_note: >
  Scales with the load impedance range: the numbers are eq 7 evaluated for
  a 4-8 ohm BTL load with the 10 uH + 0.68 uF pair, and the qualitative
  rule (check Q at the highest impedance) holds wherever the filter is a
  plain second-order LC. Outside 4-8 ohm the stated Q values do not apply.
verification: {by: "second-reader", date: "2026-09-27", note: "Pass 2: Fig 1-11 p12 8 ohm peak now ~+4 dB near 40 kHz (Q 1.47) - matches the plot; the Type-2 8 ohm case now states the second-order maximum ~+1.5 dB near 45 kHz for Q 1.04 - correct. Residual, non-blocking: 'which is why TI lists the pair for 4-8 ohm' is still inference; tpa3116 p23 Fig 35 shows only the 4-8 ohm label."}

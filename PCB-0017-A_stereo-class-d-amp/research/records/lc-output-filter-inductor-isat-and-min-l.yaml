envelope:
  ioc_trip_a: {min: 4.5, max: 7.5}
maturity: verified
generalizes: []
envelope_note: >
  Scales with the IC's overcurrent trip: the minimum-L check is evaluated at
  that current, and the sourced trips are 4.5 A (TPA3130D2) and 7.5 A
  (TPA3116D2/TPA3118D2, datasheet p7) with the 1 uH floor (p5). Other
  stages carry their own floor and response time and must be re-sourced.
verification: {by: "second-reader", date: "2026-09-27", note: "Pass 2: new citation slaa701b p20 (Fig 1-21 THD+N vs power, Fig 1-22 THD+N vs frequency at 20 W/4 ohm, four Table 1-6 inductors, linear parts lower esp. 1-6 kHz) matches the page; envelope narrowed to ioc_trip_a 4.5-7.5 A = tpa3116 p7 trip points with the p5 1 uH floor. Rest unchanged from pass 1."}

id: lc-output-filter-placement-and-loop
classes: [emi]
applies:
  topologies: [lc-output-filter]
  packages: []
  interfaces: []
  parts: []
rule:
  enforced_by: null
  loop: "output pin -> L -> filter cap -> GND kept as small and tight as possible; its area is the antenna"
  placement: "LC filter close to the output pins; ferrite/EMI filter close to the output terminals"
  traces: "direct, wide, low-impedance output traces, no detours"
prose: >
  The switching edges are fast, so the current loop from each output pin
  through the inductor and the filter cap back to GND is the radiator: "the
  size of this current loop determines its effectiveness as an antenna"
  (10.1, p28). Place the LC close to the outputs and ground its caps; a
  ferrite-bead EMI filter, if used instead of or after the LC, goes as close
  to the output terminals as possible (p28). The datasheet's layout example
  (Fig 40, p29) annotates exactly this: "Output filters placed close to the
  output pins to minimize return loop" and "Direct low impedance traces for
  PVCC and output traces", with the top layer filled with GND. The EVM
  (Fig 3, p6) shows the arrangement on a 2-layer board: the four inductors
  L1-L4 sit immediately to the right of the IC's OUTxx pins in a 2 x 2
  block, the 0.68 uF caps C21-C24 sit at the inductor outputs on the way to
  the binding posts, the RC snubber parts are between the pins and the
  inductors, and every output trace is short, wide and on the top layer.
  The bottom (Fig 4, p7) carries no output copper: its one wide route is
  the PVCC feed from the supply post to the IC, so the output loop never
  changes layer. The switch-node snubber (if fitted)
  has its own tighter rule: "layout of the snubber network is tight and
  returns directly to the GND pins on the IC" (7.3.14, p21). Speaker wires
  are antennas above 30 MHz (p21), so the filter is the last thing before
  the connector, not the first thing after the IC.
sources:

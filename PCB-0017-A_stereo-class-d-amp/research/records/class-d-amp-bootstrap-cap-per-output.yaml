  class-D constant, hence family level.'
verification: {by: "research-second-reader", date: "2026-09-27", note: "Pass 2: p16 7.3.6 >=16 V unconditional and p27 8.2.1 PVCC 4.5-26 V / 8.2.2.5 0.22 uF 25 V X5R 'for this design' now cited as stated; 24 V claim and PVCC-plus-gate-drive rationale removed. p4/p26/SLOU342A p10 unchanged and correct."}

prose: 'Power-path states to design around: valid input needs UVLO < VIN < VOVP and VIN > VBAT + VIN(DT);
  OUT then regulates (4.4 V for BQ24074) with system priority. VIN-DPM (4.5 V typ, 4.35-4.63) reduces
  input current in USB100/USB500 modes when a weak source sags; DPPM reduces charge current when load
  + charge exceed the limit; below VBSUP1 the battery supplements the load with the FET fully on, and
  a short on OUT in supplement mode turns OUT off after a deglitch and retries on a recovery timer. Startup
  begins at 100 mA before the programmed limit applies; a shorted ILIM/ISET or OUT is detected at startup.
  Fast-charge termination is disabled in DPPM and supplement modes, so a heavy load can stretch charge
  time to the safety timer.'

  packages: []
  interfaces: []
  parts:
  - BQ24074
rule:
  enforced_by: null
  ts_nofit: 10 kohm TS to VSS
  led_series_kohm: 1.5
prose: 'A high-frequency ceramic on each of IN, OUT and BAT, close to the pin with short traces to the
  pad ground, using the values on the application diagram; later adjust toward minimum for DC loads or
  higher for pulsed loads. Rate the IN cap for bad adapters: ceramics are tested to 2x their rating, so
  16 V may do for a 30 V transient (confirm with the maker). TS: 10 kohm NTC in the pack, or a fixed 10
  kohm TS to VSS when no NTC exists (charging stays valid but cell over-temperature protection is lost).
  CHG and PGOOD are open drain: LED with 1.5 kohm to OUT, or about 100 kohm pull-up to a processor rail.'
sources:
- file: research/sources/bq24074.pdf
  page: 35
  note: 10.2.2.3-10.2.2.5 TS 10 kohm, LED 1.5 kohm to OUT, pin cap guidance, 2x tested voltage
- file: research/sources/bq24074.pdf
  page: 40
  note: 12.1 decoupling at IN/OUT close to pad ground

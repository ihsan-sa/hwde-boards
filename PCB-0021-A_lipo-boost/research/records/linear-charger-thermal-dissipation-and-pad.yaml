envelope_note: 'Scales with input current: ILIM tops out at 1.5 A and dissipation grows with (VIN-VOUT)*I;
  VIN window is VIN-DPM 4.35 V to VOVP; read for BQ24074 (OUT 4.4 V), not other family members whose OUT
  differs.'

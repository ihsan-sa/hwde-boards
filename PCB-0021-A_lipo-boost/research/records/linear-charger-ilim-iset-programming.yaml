prose: 'Input limit IIN-MAX=KILIM/RILIM (EN2=1, EN1=0), valid RILIM 1.1-8 kohm, up to 1.5 A; KILIM is
  1610 A*ohm typ (1500-1720) for 500 mA-1.5 A. Fast charge ICHG=KISET/RISET, KISET 890 A*ohm typ (797-975).
  Termination (BQ24074): RITERM=ITERM*RISET/0.030 (TI example). TI''s own worked example uses KILIM=1550
  against the table''s 1610, so the two TI numbers disagree: size with the tolerance band (min 1500) so
  the actual limit never exceeds the source. Both resistors go to VSS; ILIM or ISET shorted is detected
  as a fault. Use 1% resistors; the +/-7% K spread is the real accuracy. Load sharing: system load has
  priority; DPPM then reduces charge current, and battery supplement takes over once charge current is
  zero.'

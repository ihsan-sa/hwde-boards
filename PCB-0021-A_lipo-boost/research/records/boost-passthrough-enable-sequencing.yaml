prose: 'A boost does not isolate input from output. When Vin exceeds the set Vout the TPS61023 turns the
  high-side FET fully on at 101% of target and passes Vin to Vout (resumes switching below 97%): the load
  sees Vin minus inductor DCR and FET drop, so cap the input below the load''s maximum. EN below 0.4 V
  is true shutdown (output disconnected from input, 0.1 uA); EN above 1.2 V with VIN above UVLO 1.8 V
  starts soft-start. Output short to ground is current-limited (about 350 mA below 0.4 V) and restarts
  by soft-start; OVP at about 5.7 V is the protection if the FB divider is mis-populated. On a charger-fed
  SYS rail, check the rail maximum is below the set Vout so the part stays in boost and never in pass-through.'

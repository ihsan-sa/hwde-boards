# register.yaml — the one place board part numbers live.
#
# A board's number is PCB-NNNN-R: the product key below plus the revision letter whose `dir`
# is the board's workspace directory (pd-trigger-lite-dip is PCB-0016-B).
# Revision letters run A, B, C, ... and skip I and O. Products are numbered in the order their
# first board was committed; a new product takes the next free number, a new revision of an
# existing product takes that product's next letter. `bom` is the board's fab BOM, left out
# while the board has none. `change` says what a revision changed from the one before it.
# hwde only reads this file.

products:
  PCB-0001:
    title: STM32F103 2-layer blinky dev board
    revs:
      A: {dir: PCB-0001-A_stm32-blinky, date: 2026-07-27, bom: PCB-0001-A_stm32-blinky/fab/BOM.csv}
  PCB-0002:
    title: STM32F103 4-layer USB device board with 3.3 V buck

rule:
  enforced_by: null
  emit: placement group {RP FET, controller, VCAP, CIN, input TVS} at the VIN entry; VIN/VOUT as wide
    power nets with via arrays on >= 3 layers; gate net short, keep VCAP out of the FET heat zone
prose: 'What the block must hand to constraints: a placement group anchored on the RP FET with the controller,
  its VCAP and C_IN, and the input TVS as members, next to the input connector (LM74500-Q1 Fig 11-1 has
  them all within the FET''s footprint area); VIN and VOUT marked as high-current nets needing wide pours
  and via arrays on several layers (AND90146 layout); a short-route requirement on the GATE net; and a
  keep-away between VCAP and the FET''s hot copper (sec 11.1).'

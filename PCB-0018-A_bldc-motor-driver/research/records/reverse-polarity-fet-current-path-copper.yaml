rule:
  enforced_by: null
  source_drain: thick/wide copper, the full load current path
  multilayer: spread VIN/VOUT across several layers with via arrays
  gnd: solid plane layer
prose: All load current passes through the RP FET, so its source and drain copper must be thick to cut
  resistive loss (LM74500-Q1 sec 11.1). Fig 11-1 shows the FET drain pad as a large top-layer VOUT pour
  with a grid of power vias, the source pads on a wide VIN pour, C_IN and the input TVS straddling VIN
  to the GND plane next to the FET, and C_OUT from VOUT to GND. onsemi's 4-layer test board (AND90146
  Fig 9-12) carries input and output currents on top, inner1 and inner2 together, stitched by dense via
  arrays at the connectors and FET, with inner2 also carrying the gate/enable traces and the bottom layer
  a solid GND plane - spreading current over several layers is what lowered loss and temperature in its
  measurements.

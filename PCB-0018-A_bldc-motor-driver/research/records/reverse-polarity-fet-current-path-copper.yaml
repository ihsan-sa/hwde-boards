envelope_note: Scales with load current squared times copper resistance, expressed here via the FET's
  dissipation budget (the same boards/currents as the thermal record, ~0.5 W). Needs >= 4 layers to spread
  current over three layers with a GND plane; on 2 layers the rule changes to wider/heavier copper.

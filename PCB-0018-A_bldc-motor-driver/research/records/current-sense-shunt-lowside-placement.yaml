envelope_note: 'Scales with phase current (via count and copper for the GND end) and needs a ground plane
  to stitch into. Bounded at 30 A peak because the cited three-shunt example is a DRV-class motor EVM
  in that current range; above it, via count and shunt package need re-derivation. 2-6 layers: the rule
  assumes an inner ground plane or solid bottom pour.'

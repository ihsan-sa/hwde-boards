rule:
  enforced_by: null
  emit: net ties at each shunt sense pair; SNSx_P/N as a diff-pair net class; placement group {LS FET,
    shunt, GND vias}; CSA+filter+bypass group near the shunt
prose: 'What the block must hand to constraints: (1) a net tie per sense net at each shunt so the router
  cannot take the sense nets from the pour (SLVA959B sec 7.7, Fig 7-6); (2) the SNSx_P/SNSx_N pairs as
  a differential-pair class, since TI recommends differential-pair routing tools for them; (3) a placement
  group per phase anchoring the shunt between the low-side FET source and the ground stitching (sec 7.5),
  and (4) a group holding the CSA with its filter and bypass close to it (sec 7.8). SLVA959B''s point
  is that the route restriction must be placed during placement, not discovered during routing.'
sources:

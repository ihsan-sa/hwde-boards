envelope_note: 'Scales with input voltage: the 60 V FET / 65 V controller pairing covers 12-24 V-class
  nets and inputs to ~36 V with transient margin. Above ~36 V steady input the TVS window between steady
  input and 65 V closes and the rule no longer holds.'

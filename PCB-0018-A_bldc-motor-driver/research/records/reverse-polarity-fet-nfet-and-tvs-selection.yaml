applies:
  topologies:
  - reverse-polarity-fet
  packages: []
  interfaces: []
  parts: []
rule:
  enforced_by: null
  vds: '>= highest differential voltage incl. faults; 60 V class for a 65 V-max controller and 24 V-class
    nets'
  vgs: rated >= 15 V for a 13 V charge-pump drive, else zener-clamp
  body_diode: source current rating > start-up inrush into the bulk
  rds_on: lowest practical
  tvs: breakdown above worst steady-state input, below controller abs max
prose: 'N-FET ratings for a charge-pump RP stage (LM74500-Q1 sec 9.3.1.2.2): ID above the maximum continuous
  load; VDS(max) above the highest differential voltage including faults - TI recommends up to 60 V FETs
  because the SOURCE pin is rated 65 V; the controller drives VGS to 13 V, so pick a 15 V (TI''s example:
  +/-20 V) VGS rating or clamp with a zener; lowest RDS(on). Start-up inrush flows through the BODY DIODE
  to charge the output bulk before the FET is enhanced, so its maximum source current must exceed that
  inrush. onsemi AND90146 agrees: 40 V FETs for 12 V nets, 60 V for 24 V nets, logic-level gates, 3x3
  or 5x6 exposed-pad packages. TVS (bidirectional in TI''s example): breakdown above the worst steady-state
  input and below the 65 V controller maximum; clamping voltage is far above breakdown and only matters
  under the pulse. For an input that can reach 28 V plus transients this lands on 60 V FETs and a TVS
  whose clamp stays under 60-65 V.'

    min: 0
    max: 400
envelope_note: 'The 10 ohm bound scales with the CSA''s input bias network (the 3000 ohm in Eq 2 is INA240''s),
  so it holds for INA240-class amps only. Bounded to sense bandwidths up to 400 kHz (this slot''s point):
  with R_S capped at 10 ohm the filter corner is set by C alone, and the needed bandwidth bounds the usable
  C. A different CSA has a different bias network and bound - re-derive from its datasheet.'

rule:
  enforced_by: null
  filter_location: at the CSA pins
  series_r_max_ohm_ina240: 10
  preferred: filter at the output if possible
prose: 'If the sense signal is filtered, place the filter parts as close to the CSA as possible (SLVA959B
  sec 7.8, Fig 7-7/7-8: R30/R31 1 k + C40 100 pF differential RC at the DRV CSA pins, via net ties to
  the 10 mOhm shunts). For an INA240-class amplifier the datasheet does not recommend an input filter
  at all; if one is used, keep each series resistor <= 10 ohm, because the internal bias network draws
  unequal input bias currents (Fig 9-2: IB+ rises ~90 -> 240 uA and IB- falls ~90 -> -60 uA over 0-1 V
  differential) and the drop across R_S becomes a gain error: factor 3000/(R_S+3000), i.e. 0.17% at 5
  ohm, 0.33% at 10 ohm, 3.23% at 100 ohm (Table 9-1). The two sources disagree only because the amps differ:
  the 1 k value belongs to the DRV integrated CSA; for INA240 the datasheet value governs. Check the chosen
  CSA''s own input structure before copying a filter.'
sources:
- file: research/sources/ina240.pdf
  page: 18
  note: 'sec 9.1.1 note: input filter not recommended; Fig 9-1 filter at input pins; keep series R <=
    10 ohm, bias-current mismatch creates differential error'
- file: research/sources/ina240.pdf

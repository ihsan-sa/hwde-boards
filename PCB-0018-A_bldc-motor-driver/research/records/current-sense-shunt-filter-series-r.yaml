  note: 'Fig 9-2 input bias current vs differential voltage; Eq 1-2 gain error factor 3000/(Rs+3000);
    Table 9-1: 5/10/100 ohm -> 0.17/0.33/3.23 %'
- file: research/sources/slva959b.pdf

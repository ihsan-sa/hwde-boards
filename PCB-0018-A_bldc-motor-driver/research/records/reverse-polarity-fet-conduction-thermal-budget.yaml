envelope_note: 'Scales with dissipated power and copper spreading: evidence is ~0.45-0.5 W per FET on
  a 4-layer board with current spread over three layers. Above ~0.6 W, or on 2 layers, the measured case
  temperatures no longer apply - re-derive with a thermal estimate.'

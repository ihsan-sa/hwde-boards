rule:
  enforced_by: null
  pd: I^2 x RDS(on) at hot RDS, sized to ~0.5 W
  tj: TA + PD x R_thetaJA
  package: 5x6 exposed pad preferred over 3x3 as current rises
prose: 'The RP FET is always on, so its loss is I^2 x RDS(on); onsemi sized each FET so losses stay near
  500 mW and measured them on a 4-layer board at 24 C ambient (AND90146 Table 3/4, Fig 13-18 thermal images):
  6 A through 14 mOhm (504 mW) -> 47.3 C case; 10 A through 4.8 mOhm LFPAK8 (480 mW) -> 52.8 C, through
  4.5 mOhm LFPAK4 (450 mW) -> 47.5 C in Table 3 (Fig 18''s caption table says 45.3 C; the note keeps the
  Table 3 value). Junction estimate TJ = TCASE + PD x R_thetaJT (R_thetaJT ~1 C/W assumed for 3x3/5x6)
  matched the datasheet route TJ = TA + PD x R_thetaJA within ~5 C, so the datasheet R_thetaJA is usable
  for sizing on a well-spread 4-layer board. At equal loss the 5x6 package runs cooler and leaves more
  headroom than 3x3 (Table 4 bullets). TI adds: consider the FET''s thermal resistance against its maximum
  dissipation (LM74500-Q1 p17).'
